<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>Pulse  Animated Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #F2ECE0;
    --ink: #1A1815;
    --mute: #8B8579;
    --rule: rgba(26,24,21,.14);
    --accent-a: oklch(0.62 0.16 28);
    --accent-b: oklch(0.72 0.22 28);
    --swatch: #D9583F;
    --max: 1280px;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .page { max-width: var(--max); margin: 0 auto; padding: 64px 56px 96px; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.02em; }

  /* ── HEADER ───────────────────────────────────────────────────────── */
  .hd { border-bottom: 1px solid var(--rule); padding-bottom: 48px; margin-bottom: 56px; }
  .hd-row {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    color: var(--mute); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 64px;
  }
  .hd-tag { display: flex; align-items: center; gap: 8px; }
  .hd-tag .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--swatch);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--swatch) 18%, transparent);
  }
  .hd-title {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 88px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 28px;
    max-width: 920px;
    text-wrap: balance;
  }
  .hd-title em { font-style: italic; color: var(--swatch); }
  .hd-sub {
    max-width: 640px;
    font-size: 16px;
    line-height: 1.55;
    color: rgba(26,24,21,.7);
    margin: 0 0 48px;
    text-wrap: pretty;
  }
  .hd-meta {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
    border-top: 1px solid var(--rule);
    padding-top: 24px;
  }
  .meta { display: flex; flex-direction: column; gap: 4px; }
  .meta-k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .meta-v { font-size: 13px; color: var(--ink); }

  /* ── DIRECTIONS INTRO ─────────────────────────────────────────────── */
  .dirs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 72px;
  }
  .dir-card {
    padding: 32px 32px 28px;
    border: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 20px;
    min-height: 340px;
  }
  .dir-card.dark { border-color: rgba(237,229,214,.1); }
  .dir-hd { display: flex; align-items: baseline; gap: 16px; }
  .dir-letter {
    font-family: 'Instrument Serif', serif;
    font-size: 56px;
    line-height: 1;
    font-style: italic;
  }
  .dir-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .dir-body {
    font-size: 14.5px;
    line-height: 1.55;
    margin: 0;
    max-width: 460px;
    text-wrap: pretty;
  }
  .dir-tokens { display: flex; gap: 4px; }
  .token {
    flex: 1; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
  }
  .dir-type {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px;
    border-top: 1px solid currentColor;
    border-color: color-mix(in srgb, currentColor 16%, transparent);
    padding-top: 16px;
  }

  /* ── SCENES ───────────────────────────────────────────────────────── */
  .scenes { display: flex; flex-direction: column; gap: 80px; }
  .scene {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    border-top: 1px solid var(--rule);
    padding-top: 32px;
  }
  .scene-meta { display: flex; align-items: flex-start; gap: 28px; }
  .scene-n {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 64px;
    line-height: 0.9;
    color: var(--swatch);
    flex-shrink: 0;
    min-width: 80px;
  }
  .scene-title h2 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 36px;
    line-height: 1.1;
    margin: 4px 0 12px;
    letter-spacing: -0.01em;
  }
  .scene-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid var(--rule);
    color: rgba(26,24,21,.7);
  }
  .scene-caption {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    line-height: 1.45;
    margin: 8px 0 0;
    max-width: 880px;
    color: rgba(26,24,21,.88);
    text-wrap: pretty;
  }
  .scene-tech {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 16px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin-top: 8px;
  }
  .scene-tech > div { display: flex; gap: 16px; align-items: baseline; }
  .tech-k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
    min-width: 60px;
    flex-shrink: 0;
  }
  .tech-v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink);
  }

  /* ── PANELS ───────────────────────────────────────────────────────── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 8px;
  }
  .panel-col { display: flex; flex-direction: column; gap: 10px; }
  .panel-cap {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .panel-cap span {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px;
    background: var(--ink); color: var(--bg);
    font-family: 'Instrument Serif', serif;
    font-size: 13px;
    font-style: italic;
  }
  .panel-cap.dark span { background: #EDE5D6; color: #0B0B0D; }

  .frame {
    position: relative;
    width: 100%;
    border: 1px solid currentColor;
    border-color: color-mix(in srgb, currentColor 16%, transparent);
    overflow: hidden;
  }
  .slate {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    color: color-mix(in srgb, currentColor 55%, transparent);
    pointer-events: none;
  }
  .slate .shot { padding: 2px 6px; border: 1px solid currentColor;
    border-color: color-mix(in srgb, currentColor 35%, transparent); }
  .slate .time { padding: 2px 6px; }

  /* ── FOOTER ───────────────────────────────────────────────────────── */
  .ft {
    margin-top: 96px;
    padding-top: 32px;
    border-top: 1px solid var(--rule);
  }
  .ft-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    margin-bottom: 48px;
  }
  .ft-k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 8px;
  }
  .ft-v { font-size: 14.5px; line-height: 1.55; max-width: 520px; text-wrap: pretty; }
  .ft-col ul { margin: 0; padding-left: 16px; font-size: 14.5px; line-height: 1.7; }
  .ft-col li { margin-bottom: 6px; }
  .ft-end {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mute);
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  /* Compact responsive: keep the columns paired even on narrower views. */
  @media (max-width: 1100px) {
    .page { padding: 48px 36px 72px; }
    .hd-title { font-size: 64px; }
    .hd-meta { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="storyboard.jsx"></script>
</body>
</html>
