<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Heartwise  Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400;1,8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; }
  /* The thumbnail itself is a fixed 1920×1080 canvas, scaled to fit viewport */
  .stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .thumb {
    width: 1920px; height: 1080px;
    position: relative;
    flex-shrink: 0;
    /* warm red→black radial */
    background:
      radial-gradient(ellipse 90% 70% at 50% 42%, #4A0E14 0%, #1F0A0A 40%, #080404 100%);
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6);
    font-family: 'Inter', system-ui, sans-serif;
    color: #F8F1E0;
  }

  /* Film grain overlay */
  .grain {
    position: absolute; inset: 0;
    opacity: 0.07;
    mix-blend-mode: overlay;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>");
    pointer-events: none;
  }

  /* Vignette */
  .vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 320px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  /* Top chrome */
  .top {
    position: absolute; top: 60px; left: 80px; right: 80px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand-name {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: -0.02em;
    color: #F8F1E0;
  }
  .kicker {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 18px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(248,241,224,0.55);
  }

  /* Main composition */
  .main {
    position: absolute;
    top: 220px; left: 0; right: 0; bottom: 200px;
    display: grid;
    grid-template-columns: 720px 1fr;
    gap: 0;
    padding: 0 80px;
    align-items: center;
  }

  /* Left: huge heart art */
  .heart-art {
    position: relative;
    width: 720px; height: 720px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Right: copy */
  .copy { padding-left: 30px; }
  .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 22px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #FF5567;
    margin-bottom: 32px;
    text-shadow: 0 0 30px rgba(255,85,103,0.4);
  }
  .title {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 180px;
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: #F8F1E0;
    margin: 0;
    text-shadow: 0 0 80px rgba(230,57,70,0.35);
    text-wrap: balance;
  }
  .title em {
    font-style: italic;
    color: #E63946;
    font-weight: 400;
  }
  .sub {
    margin-top: 44px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 34px;
    line-height: 1.35;
    color: rgba(248,241,224,0.78);
    max-width: 920px;
    text-wrap: pretty;
  }
  .meta {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(248,241,224,0.55);
  }
  .meta .pill {
    padding: 10px 20px;
    border: 1px solid rgba(230,57,70,0.5);
    border-radius: 999px;
    color: #FF5567;
    background: rgba(230,57,70,0.08);
  }
  .meta .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #FF5567;
    box-shadow: 0 0 16px #FF5567;
  }

  /* Bottom ECG line */
  .ecg {
    position: absolute;
    left: 80px; right: 80px;
    bottom: 60px;
    height: 80px;
    opacity: 0.9;
  }

  /* "Play" badge over the heart */
  .play {
    position: absolute;
    bottom: 96px;
    left: 800px;
    display: flex; align-items: center; gap: 18px;
    padding: 18px 28px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(248,241,224,0.18);
    backdrop-filter: blur(20px);
  }
  .play-icon {
    width: 36px; height: 36px;
    background: #E63946;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(230,57,70,0.6);
  }
  .play-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(248,241,224,0.85);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="thumb" id="thumb">

    <!-- Top chrome -->
    <div class="top">
      <div class="brand">
        <svg width="56" height="56" viewBox="-20 -20 40 40">
          <defs>
            <radialGradient id="hg" cx="35%" cy="30%" r="80%">
              <stop offset="0" stop-color="#FF8090"/>
              <stop offset="0.6" stop-color="#E63946"/>
              <stop offset="1" stop-color="#9B1B25"/>
            </radialGradient>
          </defs>
          <circle cx="0" cy="0" r="18" fill="#E63946" opacity="0.18"/>
          <path d="M 0 14 C -22 0, -20 -16, -8 -16 C -3 -16, 0 -10, 0 -6 C 0 -10, 3 -16, 8 -16 C 20 -16, 22 0, 0 14 Z" fill="url(#hg)" style="filter: drop-shadow(0 0 14px #E63946);"/>
        </svg>
        <div class="brand-name">Heartwise</div>
      </div>
      <div class="kicker">One Heart &middot; Many Lives</div>
    </div>

    <!-- Main composition -->
    <div class="main">
      <div class="heart-art">
        <svg width="720" height="720" viewBox="-300 -300 600 600">
          <defs>
            <radialGradient id="heartFill" cx="35%" cy="28%" r="80%">
              <stop offset="0%"  stop-color="#FF8090"/>
              <stop offset="40%" stop-color="#E63946"/>
              <stop offset="80%" stop-color="#9B1B25"/>
              <stop offset="100%" stop-color="#5A0E14"/>
            </radialGradient>
            <radialGradient id="halo" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#E63946" stop-opacity="0.55"/>
              <stop offset="0.4" stop-color="#E63946" stop-opacity="0.18"/>
              <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
            </radialGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
              <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Halo rings -->
          <circle cx="0" cy="0" r="280" fill="url(#halo)"/>
          <circle cx="0" cy="0" r="220" fill="none" stroke="#E63946" stroke-width="0.6" opacity="0.4"/>
          <circle cx="0" cy="0" r="260" fill="none" stroke="#E63946" stroke-width="0.4" opacity="0.25"/>

          <!-- Heart main shape, very large -->
          <path d="M 0 150 C -245 25, -235 -190, -85 -190 C -30 -190, 0 -110, 0 -65 C 0 -110, 30 -190, 85 -190 C 235 -190, 245 25, 0 150 Z"
                fill="url(#heartFill)"
                style="filter: drop-shadow(0 0 50px rgba(230,57,70,0.6));"/>

          <!-- Highlight on heart -->
          <path d="M -80 -130 C -130 -110, -135 -50, -100 -10"
                fill="none" stroke="#FFD0D6" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
          <path d="M -50 -160 C -75 -150, -80 -130, -68 -110"
                fill="none" stroke="#FFE0E5" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

          <!-- ECG line cutting through the heart -->
          <g transform="translate(-280 30)">
            <path d="M 0 0 L 80 0 C 90 0 95 -8 100 -16 C 105 -8 110 0 120 0 L 175 0 L 185 -16 L 195 -120 L 205 60 L 215 0 L 270 0 C 280 0 285 -30 295 -30 C 305 -30 310 0 320 0 L 560 0"
                  fill="none" stroke="#F8F1E0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
                  style="filter: drop-shadow(0 0 16px #F8F1E0);"/>
          </g>

          <!-- Pulse dot at end -->
          <circle cx="280" cy="30" r="10" fill="#F8F1E0"
                  style="filter: drop-shadow(0 0 24px #F8F1E0);"/>
        </svg>
      </div>

      <div class="copy">
        <div class="label">A film about the heart, made visible</div>
        <h1 class="title">A heart,<br/><em>visible.</em></h1>
        <p class="sub">From a crowded ward to a clinic at the edge of nowhere, from a lecture hall to a 3 a.m. panic attack. One tool meets them all.</p>
        <div class="meta">
          <span class="pill"><span class="dot" style="display:inline-block; vertical-align:middle; margin-right:10px;"></span> Hover me to Play &middot; </span>
          <!-- <span>HD &middot; 1920&times;1080</span> -->
        </div>
      </div>
    </div>

    <!-- Bottom ECG ribbon -->
    <svg class="ecg" viewBox="0 0 1760 80" preserveAspectRatio="none">
      <defs>
        <linearGradient id="ecgFade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#E63946" stop-opacity="0"/>
          <stop offset="0.06" stop-color="#E63946" stop-opacity="1"/>
          <stop offset="0.94" stop-color="#E63946" stop-opacity="1"/>
          <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
        </linearGradient>
        <filter id="ecgGlow" x="-2%" y="-50%" width="104%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <line x1="0" y1="40" x2="1760" y2="40" stroke="#E63946" stroke-width="0.5" opacity="0.2"/>
      <path id="ecgPath" d="" fill="none" stroke="#E63946" stroke-width="6" opacity="0.25" filter="url(#ecgGlow)" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="ecgPath2" d="" fill="none" stroke="url(#ecgFade)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="grain"></div>
    <div class="vignette"></div>
  </div>
</div>

<script>
  // Build a smooth multi-cycle ECG path for the bottom ribbon (medical PQRST).
  function ecgCycle(x0, baseline, segW, h) {
    const pAmp = h * 0.07, qAmp = h * 0.07, rAmp = h * 0.52, sAmp = h * 0.34, tAmp = h * 0.13;
    const pC = x0 + segW * 0.18, pW = segW * 0.10;
    const qrs = x0 + segW * 0.44;
    const tC = x0 + segW * 0.66, tW = segW * 0.18;
    const y = baseline;
    const bump = (cx, cyOff, w) => {
      const x1 = cx - w/2, x2 = cx + w/2;
      const cy = y - cyOff;
      return `L ${x1.toFixed(2)} ${y.toFixed(2)} C ${(x1+w*0.2).toFixed(2)} ${cy.toFixed(2)}, ${(x2-w*0.2).toFixed(2)} ${cy.toFixed(2)}, ${x2.toFixed(2)} ${y.toFixed(2)} `;
    };
    return `M ${x0.toFixed(2)} ${y.toFixed(2)} ` +
      bump(pC, pAmp, pW) +
      `L ${(qrs - segW*0.045).toFixed(2)} ${y.toFixed(2)} ` +
      `L ${(qrs - segW*0.028).toFixed(2)} ${(y+qAmp).toFixed(2)} ` +
      `L ${qrs.toFixed(2)} ${(y-rAmp).toFixed(2)} ` +
      `L ${(qrs + segW*0.028).toFixed(2)} ${(y+sAmp).toFixed(2)} ` +
      `L ${(qrs + segW*0.050).toFixed(2)} ${y.toFixed(2)} ` +
      `L ${(tC - tW/2 - segW*0.02).toFixed(2)} ${y.toFixed(2)} ` +
      bump(tC, tAmp, tW) +
      `L ${(x0 + segW).toFixed(2)} ${y.toFixed(2)}`;
  }
  const W = 1760, H = 80, segs = 5;
  const segW = W / segs;
  let d = '';
  for (let i = 0; i <= segs; i++) d += ecgCycle(i * segW, H/2, segW, H) + ' ';
  document.getElementById('ecgPath').setAttribute('d', d);
  document.getElementById('ecgPath2').setAttribute('d', d);

  // Scale-to-fit
  function fit() {
    const t = document.getElementById('thumb');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    t.style.transform = `scale(${s})`;
    t.style.transformOrigin = 'center';
  }
  fit();
  window.addEventListener('resize', fit);
</script>
</body>
</html>
