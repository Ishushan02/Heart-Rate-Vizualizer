<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>Heartwise — Illustrated Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #F0E8D4;
    color: #2A2117;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1320px; margin: 0 auto; padding: 56px 48px 80px; }

  /* ── Header ─────────────────────────────────────────────────────── */
  .hd { margin-bottom: 36px; }
  .hd h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.1;
    margin: 0 0 12px;
    color: #1F1810;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .hd .sub {
    font-size: 16px;
    color: #5C4E38;
    margin: 0;
    line-height: 1.5;
    max-width: 980px;
  }
  .hd .sub .dot { color: #9E8054; margin: 0 8px; }

  /* ── Grid of cards ──────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px 28px;
    margin-bottom: 40px;
  }
  @media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 880px)  { .grid { grid-template-columns: repeat(2, 1fr); } }

  .card { display: flex; flex-direction: column; }
  .ill {
    aspect-ratio: 3 / 2;
    width: 100%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 0 0 1px rgba(120,90,40,.18);
    background: #EFE5CE;
  }
  .ill svg { display: block; width: 100%; height: 100%; }

  .card h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.2;
    margin: 18px 0 8px;
    color: #1F1810;
    letter-spacing: -0.01em;
  }
  .card p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: #4A3E2C;
    text-wrap: pretty;
  }

  /* ── Footer guardrail ───────────────────────────────────────────── */
  .ft {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(120,90,40,.2);
    font-style: italic;
    font-size: 13.5px;
    color: #A0501C;
    font-family: 'Source Serif 4', Georgia, serif;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
// illustrated-scenes.jsx
// Painterly-style narrative storyboard panels for Heartwise.
// Each scene is a richly-layered SVG illustration (600 × 400 viewBox)
// modelled on the reference: warm muted palette, character-driven,
// device UI integrated into the scene, no flat wireframe look.

// ── Palette ─────────────────────────────────────────────────────────────────
const P = {
  paper:    '#EFE5CE',   // base canvas
  paperDk:  '#E0D2B0',
  wall:     '#D9C8A4',
  wallDk:   '#B89E70',
  shadow:   '#6E5A38',
  ink:      '#2A2117',
  inkSoft:  '#5C4E38',
  // skin
  skin:     '#D4A77A',
  skinDk:   '#B68658',
  skinDp:   '#8F6440',   // deeper skin tone for variety
  skinMd:   '#A87B52',
  // hair
  hairDk:   '#3A2A1A',
  hairBr:   '#6B4A2D',
  hairGr:   '#9C8060',
  // clothing
  coat:     '#F5EFE0',
  coatSh:   '#D6CCB4',
  scrubs:   '#5C7B8F',
  shirtBl:  '#4A6A82',
  shirtRd:  '#A04A36',
  shirtGr:  '#6B7A4F',
  shirtTn:  '#9C7A55',
  blanket:  '#C49866',
  // accent (heart / alerts / pulse)
  heart:    '#C13B2C',
  heartDk:  '#8A2418',
  accent:   '#D9583F',
  // greens
  plant:    '#5A7048',
  plantDk:  '#3D5232',
  plantLt:  '#7B9560',
  // sky / windows
  sky:      '#8FA8B8',
  skyDusk:  '#6B7A8E',
  skyNight: '#1E2738',
  skyGold:  '#E8B870',
  glowWarm: '#F4D89A',
  // screen
  screen:   '#0F1318',
  screenLt: '#1A2230',
  ui:       '#3A8DD8',
  uiAlt:    '#56C29F',
  uiWarn:   '#E0A03A',
  pulse:    '#E55B45',
  // wood / furniture
  wood:     '#B68953',
  woodDk:   '#7A552E',
  cream:    '#F8F1E0',
};

// ── Shared primitives ───────────────────────────────────────────────────────

// PulseLine — small EKG strip; chaos=0..3 fibrillates it.
function PulseLine({ x, y, w, h, stroke = P.pulse, sw = 1.4, segs = 3, chaos = 0, opacity = 1 }) {
  const seg = w / segs;
  const baseline = y + h / 2;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const cx = x + i * seg;
    pts.push(
      [cx,            baseline],
      [cx + seg*0.18, baseline - h*0.06],
      [cx + seg*0.30, baseline + h*0.05],
      [cx + seg*0.42, baseline - h*0.46],
      [cx + seg*0.50, baseline + h*0.34],
      [cx + seg*0.62, baseline - h*0.10],
      [cx + seg*0.85, baseline],
      [cx + seg,      baseline],
    );
  }
  if (chaos > 0) {
    for (const p of pts) p[1] += (Math.sin(p[0]*0.6) + Math.cos(p[0]*1.3)) * chaos;
  }
  return (
    <polyline points={pts.map(p => p.join(',')).join(' ')}
              fill="none" stroke={stroke} strokeWidth={sw}
              strokeLinecap="round" strokeLinejoin="round" opacity={opacity}/>
  );
}

// Heart icon — filled, with soft inner highlight. Looks more illustrated than emoji.
function Heart({ cx, cy, r, fill = P.heart, highlight = true }) {
  return (
    <g transform={`translate(${cx} ${cy})`}>
      <path d={`M 0 ${r*0.85} C ${-r*1.2} ${r*0.2}, ${-r*1.1} ${-r*0.7}, ${-r*0.4} ${-r*0.7}
                C ${-r*0.15} ${-r*0.7}, 0 ${-r*0.4}, 0 ${-r*0.2}
                C 0 ${-r*0.4}, ${r*0.15} ${-r*0.7}, ${r*0.4} ${-r*0.7}
                C ${r*1.1} ${-r*0.7}, ${r*1.2} ${r*0.2}, 0 ${r*0.85} Z`} fill={fill}/>
      {highlight && (
        <path d={`M ${-r*0.6} ${-r*0.55} C ${-r*0.85} ${-r*0.4}, ${-r*0.85} ${-r*0.05}, ${-r*0.55} ${r*0.1}`}
              fill="none" stroke="#FFF" strokeWidth={r*0.12} strokeLinecap="round" opacity="0.45"/>
      )}
    </g>
  );
}

// Plant — leaves emerging from a pot. Pot at origin baseline.
function Plant({ x, y, scale = 1, leafColor = P.plant, potColor = P.wood }) {
  const s = scale;
  return (
    <g transform={`translate(${x} ${y}) scale(${s})`}>
      {/* pot */}
      <path d="M -14 0 L 14 0 L 11 22 L -11 22 Z" fill={potColor}/>
      <ellipse cx="0" cy="0" rx="14" ry="3" fill={potColor} stroke={P.shadow} strokeWidth="0.4"/>
      <path d="M -14 0 L 14 0 L 11 22 L -11 22 Z" fill={P.shadow} opacity="0.18"/>
      {/* leaves — five blades */}
      <path d="M -2 0 Q -22 -12 -26 -32 Q -18 -34 -10 -22 Q -4 -10 -2 0 Z" fill={leafColor}/>
      <path d="M 2 0 Q 22 -8 28 -28 Q 20 -34 12 -22 Q 4 -10 2 0 Z" fill={leafColor} opacity="0.92"/>
      <path d="M 0 0 Q -2 -22 6 -42 Q 12 -38 8 -22 Q 4 -10 0 0 Z" fill={leafColor} opacity="0.85"/>
      <path d="M -1 0 Q -12 -20 -8 -42 Q -2 -42 -2 -22 Q -2 -10 -1 0 Z" fill={P.plantDk}/>
      <path d="M 1 0 Q 16 -16 22 -38 Q 16 -42 10 -28 Q 4 -10 1 0 Z" fill={P.plantDk} opacity="0.6"/>
      {/* leaf veins (subtle) */}
      <path d="M 0 -2 Q 3 -22 8 -36" fill="none" stroke={P.plantDk} strokeWidth="0.5" opacity="0.6"/>
    </g>
  );
}

// Mug — simple ceramic, optional steam.
function Mug({ x, y, scale = 1, color = '#3D5A6E', steam = false }) {
  const s = scale;
  return (
    <g transform={`translate(${x} ${y}) scale(${s})`}>
      {steam && (
        <g opacity="0.4" stroke="#FFF" strokeWidth="1" fill="none" strokeLinecap="round">
          <path d="M -4 -2 Q -2 -8 -4 -14 Q -6 -20 -3 -26"/>
          <path d="M 3 -2 Q 5 -8 3 -14 Q 1 -20 4 -26"/>
        </g>
      )}
      <path d="M -10 0 L 10 0 L 9 16 Q 8 20 0 20 Q -8 20 -9 16 Z" fill={color}/>
      <ellipse cx="0" cy="0" rx="10" ry="2.5" fill={color} stroke={P.shadow} strokeWidth="0.5"/>
      <ellipse cx="0" cy="0" rx="7" ry="1.6" fill="#1A1410"/>
      <path d="M 10 4 Q 18 6 18 12 Q 18 17 10 17" fill="none" stroke={color} strokeWidth="2.4"/>
      {/* shadow on body */}
      <path d="M 4 2 L 9 16 Q 8 20 0 20 L 0 2 Z" fill="#000" opacity="0.18"/>
    </g>
  );
}

// Window — frame + view + light wash.
function Window({ x, y, w, h, view = 'day' }) {
  const skyFill = view === 'night' ? P.skyNight : view === 'dusk' ? P.skyDusk : view === 'gold' ? P.skyGold : P.sky;
  return (
    <g transform={`translate(${x} ${y})`}>
      {/* outer frame */}
      <rect x="-4" y="-4" width={w + 8} height={h + 8} fill={P.cream}/>
      <rect x="0" y="0" width={w} height={h} fill={skyFill}/>
      {/* mullion */}
      <line x1={w/2} y1="0" x2={w/2} y2={h} stroke={P.cream} strokeWidth="4"/>
      <line x1="0" y1={h/2} x2={w} y2={h/2} stroke={P.cream} strokeWidth="4"/>
      {/* light/details inside */}
      {view === 'day' && (
        <>
          <path d={`M 4 ${h - 28} Q ${w/4} ${h - 50} ${w/2 - 4} ${h - 30}`} fill="none" stroke="#FFF" strokeWidth="2" opacity="0.5"/>
          <circle cx={w - 18} cy="22" r="8" fill="#FFF" opacity="0.6"/>
        </>
      )}
      {view === 'dusk' && (
        <>
          <rect x="0" y={h*0.55} width={w} height={h*0.45} fill="#9E7A6E" opacity="0.5"/>
          <circle cx={w*0.7} cy={h*0.4} r="6" fill={P.skyGold}/>
        </>
      )}
      {view === 'night' && (
        <>
          {[10, 25, 40, 55, 70, 85].map((px, k) => (
            <circle key={k} cx={px * w / 100} cy={h * 0.3 + (k%3)*4} r={Math.random()*0.6 + 0.6} fill="#FFF" opacity="0.7"/>
          ))}
          {/* city lights */}
          {[8, 20, 30, 42, 55, 68, 80, 90].map((px, k) => (
            <rect key={k} x={px * w / 100} y={h*0.7 + (k%2)*4} width="1" height="2" fill={P.skyGold} opacity="0.9"/>
          ))}
        </>
      )}
      {/* sill */}
      <rect x="-6" y={h} width={w + 12} height="4" fill={P.wood}/>
    </g>
  );
}

// Heart UI screen contents — used inside laptops / tablets / phones / tv.
function ScreenContent({ x, y, w, h, accent = P.accent, type = 'visualizer', bg = '#FBF6E8' }) {
  return (
    <g transform={`translate(${x} ${y})`}>
      <rect x="0" y="0" width={w} height={h} fill={bg}/>
      {type === 'visualizer' && (
        <>
          {/* 3D heart, big */}
          <ellipse cx={w*0.32} cy={h*0.55} rx={w*0.16} ry={h*0.32} fill={P.heart} opacity="0.18"/>
          <Heart cx={w*0.32} cy={h*0.5} r={Math.min(w, h)*0.22} fill={P.heart}/>
          {/* ECG strip */}
          <rect x={w*0.55} y={h*0.18} width={w*0.4} height={h*0.18} fill="#F0E6CC" opacity="0.5"/>
          <g clipPath={`url(#sc-clip-${x}-${y})`}>
            <PulseLine x={w*0.55} y={h*0.2} w={w*0.4} h={h*0.16} stroke={accent} sw={1.1} segs={3}/>
          </g>
          <defs><clipPath id={`sc-clip-${x}-${y}`}><rect x={w*0.55} y={h*0.18} width={w*0.4} height={h*0.18}/></clipPath></defs>
          {/* BPM block */}
          <text x={w*0.56} y={h*0.5} fontFamily="Source Serif 4, Georgia, serif" fontWeight="600" fontSize={h*0.18} fill={P.ink}>72</text>
          <text x={w*0.78} y={h*0.5} fontFamily="Inter" fontSize={h*0.07} fill={P.inkSoft}>BPM</text>
          <text x={w*0.56} y={h*0.62} fontFamily="Inter" fontSize={h*0.07} fontWeight="500" fill={accent}>● NORMAL</text>
          {/* status pills */}
          <rect x={w*0.55} y={h*0.7} width={w*0.12} height={h*0.08} rx={h*0.04} fill="#9CB89A"/>
          <rect x={w*0.68} y={h*0.7} width={w*0.12} height={h*0.08} rx={h*0.04} fill="#E0C28A"/>
          <rect x={w*0.81} y={h*0.7} width={w*0.12} height={h*0.08} rx={h*0.04} fill="#D88E70"/>
        </>
      )}
      {type === 'alert' && (
        <>
          <rect x="0" y="0" width={w} height={h*0.22} fill={P.heart}/>
          <text x={w*0.5} y={h*0.16} fontFamily="Inter" fontWeight="700" fontSize={h*0.12} fill="#FFF" textAnchor="middle">⚠  AFib DETECTED</text>
          <text x={w*0.5} y={h*0.42} fontFamily="Source Serif 4" fontWeight="700" fontSize={h*0.32} fill={P.ink} textAnchor="middle">142</text>
          <text x={w*0.5} y={h*0.52} fontFamily="Inter" fontSize={h*0.08} fill={P.inkSoft} textAnchor="middle">BPM</text>
          <g clipPath={`url(#al-clip-${x}-${y})`}>
            <PulseLine x={w*0.08} y={h*0.6} w={w*0.84} h={h*0.2} stroke={accent} sw={1.4} chaos={2.4} segs={3}/>
          </g>
          <defs><clipPath id={`al-clip-${x}-${y}`}><rect x={w*0.08} y={h*0.6} width={w*0.84} height={h*0.2}/></clipPath></defs>
          <text x={w*0.5} y={h*0.94} fontFamily="Inter" fontSize={h*0.07} fill={P.inkSoft} textAnchor="middle">DR. PATEL NOTIFIED · 14:08</text>
        </>
      )}
      {type === 'calm' && (
        <>
          <rect x="0" y="0" width={w} height={h} fill="#2D3548"/>
          <circle cx={w*0.5} cy={h*0.42} r={h*0.32} fill="none" stroke={accent} strokeWidth="1.2" opacity="0.4"/>
          <circle cx={w*0.5} cy={h*0.42} r={h*0.24} fill="none" stroke={accent} strokeWidth="1.4" opacity="0.7"/>
          <circle cx={w*0.5} cy={h*0.42} r={h*0.16} fill={accent} opacity="0.85"/>
          <text x={w*0.5} y={h*0.45} fontFamily="Inter" fontSize={h*0.1} fontWeight="500" fill="#FFF" textAnchor="middle">breathe</text>
          <text x={w*0.5} y={h*0.82} fontFamily="Source Serif 4" fontWeight="600" fontSize={h*0.16} fill="#F0E5D2" textAnchor="middle">64 BPM</text>
          <text x={w*0.5} y={h*0.92} fontFamily="Inter" fontSize={h*0.07} fill="#A8B0C0" textAnchor="middle">HRV 0.81 · coherent</text>
        </>
      )}
      {type === 'remote' && (
        <>
          <rect x="0" y="0" width={w*0.62} height={h} fill="#1A2230"/>
          {/* video tile — patient */}
          <rect x={w*0.05} y={h*0.08} width={w*0.52} height={h*0.62} fill="#3A4658"/>
          {/* simple face inside */}
          <circle cx={w*0.31} cy={h*0.32} r={h*0.12} fill={P.skinDp}/>
          <path d={`M ${w*0.16} ${h*0.62} Q ${w*0.31} ${h*0.46} ${w*0.46} ${h*0.62} L ${w*0.46} ${h*0.7} L ${w*0.16} ${h*0.7} Z`} fill={P.shirtBl}/>
          <text x={w*0.07} y={h*0.78} fontFamily="Inter" fontSize={h*0.06} fill="#A8B0C0">Amara · Kibera Clinic</text>
          {/* ECG strip on right side */}
          <rect x={w*0.62} y="0" width={w*0.38} height={h} fill="#F0E6CC"/>
          <text x={w*0.65} y={h*0.12} fontFamily="Inter" fontSize={h*0.06} fill={P.inkSoft}>HEART RATE</text>
          <text x={w*0.65} y={h*0.28} fontFamily="Source Serif 4" fontWeight="600" fontSize={h*0.18} fill={P.ink}>118</text>
          <text x={w*0.84} y={h*0.28} fontFamily="Inter" fontSize={h*0.07} fill={P.inkSoft}>BPM</text>
          <text x={w*0.65} y={h*0.38} fontFamily="Inter" fontSize={h*0.06} fill={P.uiWarn}>● ELEVATED</text>
          <g clipPath={`url(#rc-clip-${x}-${y})`}>
            <PulseLine x={w*0.64} y={h*0.5} w={w*0.32} h={h*0.18} stroke={accent} sw={1.2}/>
          </g>
          <defs><clipPath id={`rc-clip-${x}-${y}`}><rect x={w*0.64} y={h*0.5} width={w*0.32} height={h*0.18}/></clipPath></defs>
          <text x={w*0.65} y={h*0.78} fontFamily="Inter" fontSize={h*0.05} fill={P.inkSoft}>MI cue: monitor</text>
          <text x={w*0.65} y={h*0.86} fontFamily="Inter" fontSize={h*0.05} fill={P.inkSoft}>Lat 240ms · 6,420km</text>
        </>
      )}
      {type === 'dashboard' && (
        <>
          <text x={w*0.06} y={h*0.16} fontFamily="Inter" fontSize={h*0.08} fill={P.inkSoft}>POST-OP · DAY 14</text>
          <text x={w*0.06} y={h*0.4} fontFamily="Source Serif 4" fontWeight="600" fontSize={h*0.26} fill={P.ink}>68</text>
          <text x={w*0.3} y={h*0.4} fontFamily="Inter" fontSize={h*0.09} fill={P.inkSoft}>BPM</text>
          <text x={w*0.06} y={h*0.5} fontFamily="Inter" fontSize={h*0.07} fill={P.uiAlt}>● RESTING · OK</text>
          <g clipPath={`url(#db-clip-${x}-${y})`}>
            <PulseLine x={w*0.06} y={h*0.6} w={w*0.88} h={h*0.18} stroke={accent} sw={1.2}/>
          </g>
          <defs><clipPath id={`db-clip-${x}-${y}`}><rect x={w*0.06} y={h*0.6} width={w*0.88} height={h*0.18}/></clipPath></defs>
          <text x={w*0.06} y={h*0.9} fontFamily="Inter" fontSize={h*0.06} fill={P.inkSoft}>14-day trend ↓ stable</text>
        </>
      )}
      {type === 'lecture' && (
        <>
          {/* Big heart diagram + labels */}
          <Heart cx={w*0.32} cy={h*0.5} r={h*0.32} fill={P.heart}/>
          <line x1={w*0.18} y1={h*0.36} x2={w*0.06} y2={h*0.2} stroke={P.inkSoft} strokeWidth="0.6"/>
          <text x={w*0.02} y={h*0.18} fontFamily="Inter" fontSize={h*0.06} fill={P.inkSoft}>Aorta</text>
          <line x1={w*0.42} y1={h*0.6} x2={w*0.5} y2={h*0.78} stroke={P.inkSoft} strokeWidth="0.6"/>
          <text x={w*0.46} y={h*0.84} fontFamily="Inter" fontSize={h*0.06} fill={P.inkSoft}>Left ventricle</text>
          <line x1={w*0.42} y1={h*0.4} x2={w*0.6} y2={h*0.28} stroke={P.inkSoft} strokeWidth="0.6"/>
          <text x={w*0.62} y={h*0.28} fontFamily="Inter" fontSize={h*0.06} fill={P.inkSoft}>Coronary a.</text>
          <text x={w*0.62} y={h*0.5} fontFamily="Source Serif 4" fontWeight="600" fontSize={h*0.16} fill={P.ink}>72 BPM</text>
          <g clipPath={`url(#lc-clip-${x}-${y})`}>
            <PulseLine x={w*0.6} y={h*0.6} w={w*0.36} h={h*0.16} stroke={accent} sw={1.1}/>
          </g>
          <defs><clipPath id={`lc-clip-${x}-${y}`}><rect x={w*0.6} y={h*0.6} width={w*0.36} height={h*0.16}/></clipPath></defs>
        </>
      )}
      {type === 'quiz' && (
        <>
          <Heart cx={w*0.28} cy={h*0.5} r={h*0.28} fill={P.heart}/>
          {/* control toggles */}
          {['AUTO-ROTATE','LABELS','FLOW GLOW','FOCUS'].map((t,k) => (
            <g key={t} transform={`translate(${w*0.06 + k*(w*0.13)} ${h*0.08})`}>
              <rect x="0" y="0" width={w*0.11} height={h*0.06} rx={h*0.03} fill={k<2?accent:'#D8C8A0'}/>
              <circle cx={k<2 ? w*0.085 : w*0.025} cy={h*0.03} r={h*0.022} fill="#FFF"/>
            </g>
          ))}
          {/* quiz panel */}
          <text x={w*0.55} y={h*0.32} fontFamily="Inter" fontWeight="600" fontSize={h*0.08} fill={P.ink}>Which is the QRS?</text>
          {['P wave', 'QRS complex', 'T wave'].map((opt, k) => (
            <g key={opt} transform={`translate(${w*0.55} ${h*0.42 + k*(h*0.16)})`}>
              <rect x="0" y="0" width={h*0.1} height={h*0.1} fill={k===1?accent:'none'} stroke={P.inkSoft} strokeWidth="0.8"/>
              {k===1 && <path d={`M ${h*0.025} ${h*0.05} L ${h*0.04} ${h*0.07} L ${h*0.08} ${h*0.025}`} fill="none" stroke="#FFF" strokeWidth="1.6"/>}
              <text x={h*0.16} y={h*0.085} fontFamily="Inter" fontSize={h*0.08} fill={P.ink}>{opt}</text>
            </g>
          ))}
        </>
      )}
    </g>
  );
}

// Detailed human figure: head, hair, neck, torso. Built from layered shapes.
// `pose`: 'front', 'profile-r', 'profile-l', 'back', 'lean'. `coat`: white coat.
// `garment`: torso color. `hair`: { color, style: 'short'|'long'|'bun'|'wrap'|'curly' }.
// `skin`: face/neck color.
function Person({ x, y, scale = 1, pose = 'front', coat = false, garment = P.shirtBl,
                  hair = { color: P.hairDk, style: 'short' },
                  skin = P.skin, stethoscope = false, badge = false }) {
  const s = scale;
  const headR = 22;
  const torsoH = 80;
  const torsoW = 50;
  const headCx = pose === 'profile-r' ? 4 : pose === 'profile-l' ? -4 : 0;
  return (
    <g transform={`translate(${x} ${y}) scale(${s})`}>
      {/* shadow */}
      <ellipse cx="0" cy={torsoH + 4} rx={torsoW*0.7} ry="4" fill="#000" opacity="0.18"/>
      {/* torso (coat or shirt) */}
      <path d={`M ${-torsoW/2} ${torsoH} L ${-torsoW/2} 4 Q ${-torsoW/2} -4 ${-torsoW/2 + 10} -6 L ${torsoW/2 - 10} -6 Q ${torsoW/2} -4 ${torsoW/2} 4 L ${torsoW/2} ${torsoH} Z`}
            fill={coat ? P.coat : garment}/>
      {/* shoulder shadow */}
      <path d={`M ${-torsoW/2} 4 Q -8 -2 0 0 Q 8 -2 ${torsoW/2} 4 L ${torsoW/2} 12 L ${-torsoW/2} 12 Z`} fill={P.shadow} opacity="0.12"/>
      {/* coat collar / lapel */}
      {coat && (
        <>
          <path d={`M -8 -6 L 0 14 L 8 -6 Z`} fill={garment}/>
          <path d={`M -10 -6 L 0 16 L 10 -6`} fill="none" stroke={P.coatSh} strokeWidth="1"/>
          <line x1="0" y1="16" x2="0" y2={torsoH} stroke={P.coatSh} strokeWidth="0.8"/>
        </>
      )}
      {/* stethoscope around neck */}
      {stethoscope && (
        <>
          <path d="M -14 -4 Q -16 12 -10 22" fill="none" stroke={P.ink} strokeWidth="1.6"/>
          <path d="M 14 -4 Q 16 12 10 22" fill="none" stroke={P.ink} strokeWidth="1.6"/>
          <path d="M -10 22 Q -2 26 6 24 Q 12 22 14 18" fill="none" stroke={P.ink} strokeWidth="1.6"/>
          <circle cx="14" cy="18" r="4" fill={P.ink}/>
          <circle cx="14" cy="18" r="2" fill={P.shadow}/>
        </>
      )}
      {/* badge clip */}
      {badge && (
        <g transform="translate(-12 22)">
          <rect x="-4" y="-2" width="8" height="10" fill={P.shirtBl} stroke={P.ink} strokeWidth="0.5"/>
          <rect x="-3" y="0" width="6" height="2" fill="#FFF"/>
        </g>
      )}
      {/* neck */}
      <rect x={headCx - 6} y={-16} width="12" height="12" fill={skin}/>
      <path d={`M ${headCx - 6} -10 Q ${headCx} -6 ${headCx + 6} -10`} fill="none" stroke={P.shadow} strokeWidth="0.6" opacity="0.5"/>
      {/* head shape — slight oval, varies by pose */}
      {pose === 'profile-r' && (
        <>
          <path d={`M ${headCx - headR*0.6} ${-26} Q ${headCx - headR*0.8} ${-headR - 4} ${headCx} ${-headR - 6} Q ${headCx + headR*0.9} ${-headR - 4} ${headCx + headR} ${-headR + 6} Q ${headCx + headR + 2} ${-4} ${headCx + headR*0.7} ${0} Q ${headCx + headR*0.4} 2 ${headCx + headR*0.6} 6 L ${headCx - 6} 6 Q ${headCx - headR*0.8} 2 ${headCx - headR*0.6} ${-26} Z`}
                fill={skin}/>
          {/* ear */}
          <ellipse cx={headCx + headR*0.7} cy={-headR*0.2} rx="3" ry="5" fill={P.skinDk}/>
          {/* eye (small) */}
          <circle cx={headCx + headR*0.85} cy={-headR*0.5} r="1.4" fill={P.ink}/>
          {/* nose hint */}
          <path d={`M ${headCx + headR} ${-headR*0.4} Q ${headCx + headR + 4} ${-headR*0.2} ${headCx + headR - 2} 0`} fill="none" stroke={P.skinDk} strokeWidth="1.2" strokeLinecap="round"/>
          {/* mouth */}
          <path d={`M ${headCx + headR - 4} ${headR*0.15} Q ${headCx + headR - 6} ${headR*0.25} ${headCx + headR - 10} ${headR*0.18}`} fill="none" stroke={P.heartDk} strokeWidth="1.2" strokeLinecap="round"/>
        </>
      )}
      {pose !== 'profile-r' && pose !== 'back' && (
        <>
          <ellipse cx={headCx} cy={-headR + 2} rx={headR} ry={headR + 2} fill={skin}/>
          {/* face shading */}
          <path d={`M ${headCx + headR*0.4} ${-headR*1.6} Q ${headCx + headR} ${-headR*0.4} ${headCx + headR*0.5} ${headR*0.2}`} fill={P.skinDk} opacity="0.22"/>
          {/* eyes */}
          <ellipse cx={headCx - 7} cy={-headR*0.7} rx="2.2" ry="1.4" fill={P.ink}/>
          <ellipse cx={headCx + 7} cy={-headR*0.7} rx="2.2" ry="1.4" fill={P.ink}/>
          {/* eyebrows */}
          <path d={`M ${headCx - 11} ${-headR*0.95} Q ${headCx - 7} ${-headR - 4} ${headCx - 3} ${-headR*0.9}`} fill="none" stroke={hair.color} strokeWidth="1.4" strokeLinecap="round"/>
          <path d={`M ${headCx + 3} ${-headR*0.9} Q ${headCx + 7} ${-headR - 4} ${headCx + 11} ${-headR*0.95}`} fill="none" stroke={hair.color} strokeWidth="1.4" strokeLinecap="round"/>
          {/* nose */}
          <path d={`M ${headCx} ${-headR*0.4} Q ${headCx - 1} ${-headR*0.05} ${headCx + 2} ${headR*0.05}`} fill="none" stroke={P.skinDk} strokeWidth="0.8" strokeLinecap="round"/>
          {/* mouth */}
          <path d={`M ${headCx - 5} ${headR*0.4} Q ${headCx} ${headR*0.55} ${headCx + 5} ${headR*0.4}`} fill="none" stroke={P.heartDk} strokeWidth="1.2" strokeLinecap="round" opacity="0.7"/>
        </>
      )}
      {pose === 'back' && (
        <>
          <ellipse cx="0" cy={-headR + 2} rx={headR} ry={headR + 2} fill={hair.color}/>
        </>
      )}
      {/* hair on top */}
      {pose !== 'back' && hair.style === 'short' && (
        <path d={`M ${headCx - headR + 2} ${-headR*0.5} Q ${headCx - headR + 6} ${-headR - 4} ${headCx} ${-headR - 6} Q ${headCx + headR - 4} ${-headR - 4} ${headCx + headR - 2} ${-headR*0.5} Q ${headCx + headR - 6} ${-headR + 4} ${headCx + headR*0.6} ${-headR*0.7} Q ${headCx} ${-headR + 2} ${headCx - headR + 6} ${-headR*0.7} Z`} fill={hair.color}/>
      )}
      {pose !== 'back' && hair.style === 'long' && (
        <>
          <path d={`M ${headCx - headR - 2} ${-4} Q ${headCx - headR - 4} ${-headR*0.6} ${headCx - headR + 4} ${-headR - 4} Q ${headCx} ${-headR - 8} ${headCx + headR - 4} ${-headR - 4} Q ${headCx + headR + 4} ${-headR*0.6} ${headCx + headR + 2} ${-4} L ${headCx + headR*0.6} 4 L ${headCx - headR*0.6} 4 Z`} fill={hair.color}/>
          <path d={`M ${headCx - headR - 2} -4 Q ${headCx - headR - 4} 14 ${headCx - headR + 2} 24 L ${headCx - headR + 6} 4 Z`} fill={hair.color}/>
          <path d={`M ${headCx + headR + 2} -4 Q ${headCx + headR + 4} 14 ${headCx + headR - 2} 24 L ${headCx + headR - 6} 4 Z`} fill={hair.color}/>
        </>
      )}
      {pose !== 'back' && hair.style === 'bun' && (
        <>
          <path d={`M ${headCx - headR + 2} ${-headR*0.6} Q ${headCx} ${-headR - 6} ${headCx + headR - 2} ${-headR*0.6} L ${headCx + headR*0.4} ${-headR*0.5} L ${headCx - headR*0.4} ${-headR*0.5} Z`} fill={hair.color}/>
          <circle cx={headCx} cy={-headR - 8} r="9" fill={hair.color}/>
        </>
      )}
      {pose !== 'back' && hair.style === 'wrap' && (
        <path d={`M ${headCx - headR - 2} ${-4} Q ${headCx - headR - 4} ${-headR} ${headCx} ${-headR - 6} Q ${headCx + headR + 4} ${-headR} ${headCx + headR + 2} ${-4} L ${headCx + headR - 2} ${-headR*0.4} Q ${headCx} ${-headR + 4} ${headCx - headR + 2} ${-headR*0.4} Z`} fill={hair.color}/>
      )}
      {pose !== 'back' && hair.style === 'curly' && (
        <>
          {[-headR + 2, -headR*0.4, headCx, headR*0.4, headR - 2].map((cx, k) => (
            <circle key={k} cx={headCx + cx - headCx + (k - 2) * 7} cy={-headR + 2 + (k%2)*2} r="6" fill={hair.color}/>
          ))}
        </>
      )}
    </g>
  );
}
